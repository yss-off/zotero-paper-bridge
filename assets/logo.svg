<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zotero Paper Bridge logo">
  <!-- Transparent background with ~10% safe padding for square plugin cards -->
  <defs>
    <linearGradient id="zRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="bridgeTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile with subtle high-contrast stroke for both light and dark UI themes -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#zRed)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Stylized Z mark (Zotero) -->
  <path d="M36 34 H80 L45 74 H82" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Reverse-SSH bridge arc + bidirectional sync pill at bottom-right -->
  <rect x="64" y="76" width="44" height="30" rx="15" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M74 91 H98 M92 85 L98 91 L92 97 M80 85 L74 91 L80 97" fill="none" stroke="url(#bridgeTeal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
