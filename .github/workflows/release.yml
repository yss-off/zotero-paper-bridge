name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build & test dependencies
        run: python -m pip install --upgrade build pytest httpx
      - name: Run test suite
        run: pytest -v
      - name: Build Python sdist and wheel
        run: python -m build
      - name: Build zero-dependency portable client bundle
        run: ./scripts/package-client-bundle.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/zotero-paper-bridge-client.zip
